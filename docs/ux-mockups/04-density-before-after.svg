    <rect x="896" y="690" width="200" height="7" rx="3" fill="#e8e2f2"/>
    <rect x="1262" y="672" width="80" height="22" rx="11" fill="#ccfbf1"/><text x="1302" y="687" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">scheduled</text>
    <text x="816" y="744" font-size="11" fill="#756a8a">…virtualized list — 4 more rows below render on scroll</text>
